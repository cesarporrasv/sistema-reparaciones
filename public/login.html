<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <link href="/css/output.css" rel="stylesheet">
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

    <div class="bg-white p-8 rounded-xl shadow w-full max-w-sm">

        <h1 class="text-2xl font-bold text-center mb-6">
            Sistema Reparaciones
        </h1>

        <form onsubmit="login(event)">
            <input id="username" class="border p-2 rounded w-full mb-4" placeholder="Usuario" />

            <input id="password" type="password" class="border p-2 rounded w-full mb-4" placeholder="Contraseña" />

            <button type="submit" class="bg-indigo-600 text-white w-full py-2 rounded">
                Ingresar
            </button>
        </form>

    </div>

    <script>

        async function login(event) {
            event.preventDefault();

            const body = {

                username:
                    document.getElementById('username').value,

                password:
                    document.getElementById('password').value
            };

            const res = await fetch('/login', {
                method: 'POST',

                headers: {
                    'Content-Type': 'application/json'
                },

                body: JSON.stringify(body)
            });

            if (!res.ok) {
                alert('Credenciales incorrectas');
                return;
            }

            window.location.href = '/';
        }

    </script>

</body>

</html>
